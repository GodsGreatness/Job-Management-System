spring:
  datasource:
    url: jdbc:h2:mem:jmstestdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

jms:
  worker:
    enabled: false
    pool-size: 2
    base-backoff-ms: 100
    default-max-attempts: 3
  seed:
    enabled: false
