server:
  port: ${PORT:8080}

spring:
  application:
    name: job-management-system
  datasource:
    url: jdbc:h2:mem:jmsdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

jms:
  jwt:
    # 256-bit base64-encoded secret for local dev (override via JMS_JWT_SECRET in production)
    secret: ${JMS_JWT_SECRET:Y29tLmptcy5zdXBlci5zZWNyZXQucG9ydGZvbGlvLmtleS4yMDI2LnByb2R1Y3Rpb24=}
    expiration-ms: 86400000
  worker:
    enabled: true
    pool-size: 4
    poll-interval-ms: 1000
    base-backoff-ms: 1500
    default-max-attempts: 3
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80}
  seed:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.jms: INFO
