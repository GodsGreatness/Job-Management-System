name: CI — Build, Test & Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-java:
    name: Backend (Java 21 + Spring Boot + JUnit 5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Compile and Run JUnit 5 Test Suite
        run: ./mvnw test -B

      - name: Package Spring Boot Artifact
        run: ./mvnw package -DskipTests -B

  frontend-react:
    name: Frontend (React + TypeScript + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Type-check & Production Build (Vite)
        run: npm run build

  docker-compose-validate:
    name: Infrastructure (Docker Compose Validation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml syntax
        run: docker compose config --quiet
